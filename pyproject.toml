[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "injectprobe"
version = "0.1.0"
description = "Red-team LLM apps and agents for prompt injection, locally and in CI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "injectprobe contributors" }]
keywords = ["llm", "prompt-injection", "security", "red-team", "ci", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
injectprobe = "injectprobe.cli:app"

[project.urls]
Homepage = "https://github.com/injectprobe/injectprobe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
injectprobe = ["attacks/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
